<!DOCTYPE html>
<html>
<head><title>Debug Test</title></head>
<body>
<h1>JS Debug Test</h1>
<pre id="output"></pre>
<script src="/js/vendor/jquery.min.js"></script>
<script src="/js/app.js?t=20220817"></script>
<script>
var out = document.getElementById('output');
var lines = [];
lines.push('window.$ = ' + typeof window.$);
lines.push('window.jQuery = ' + typeof window.jQuery);
lines.push('window.toastr = ' + typeof window.toastr);
lines.push('window.Swal = ' + typeof window.Swal);
lines.push('window.axios = ' + typeof window.axios);
lines.push('window.Alpine = ' + typeof window.Alpine);
lines.push('window.utils = ' + typeof window.utils);
lines.push('jQuery version = ' + (window.jQuery ? window.jQuery.fn.jquery : 'N/A'));
lines.push('$.fn.jquery = ' + (window.$ ? window.$.fn.jquery : 'N/A'));

// Test toastr
try {
    if (window.toastr) {
        lines.push('toastr.success = ' + typeof window.toastr.success);
    }
} catch(e) {
    lines.push('toastr error: ' + e.message);
}

// Test axios
try {
    if (window.axios) {
        lines.push('axios.get = ' + typeof window.axios.get);
    }
} catch(e) {
    lines.push('axios error: ' + e.message);
}

out.textContent = lines.join('\n');
</script>
</body>
</html>
